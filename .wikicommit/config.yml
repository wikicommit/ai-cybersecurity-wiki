wikicommit_version: "0.12.0"

translation:
  targets: [ja]
  primary_lang: en

# What this wiki is about — used to skip entities unrelated to the subject when a
# source has already been taken in. This decides relevance only; two neighbouring
# questions have their own files, and writing either one here does not work:
#   - which sources to take in  -> .wikicommit/source-policy.md  (Issue #564)
#   - whether a relevant subject may be written about at all
#     ("no pages about living individuals") -> .wikicommit/entity-policy.md (#667)
# A rule of the second kind put here is read at the right moment but weighed as
# relevance, which is a different question and gives a different answer for a
# subject that is squarely on-topic and still off-limits.
# theme: "Where artificial intelligence and cybersecurity meet: attacks on AI systems, AI used for defence and for attack, the frameworks and rules that govern them, and the incidents where they happened."

theme: |
  Where artificial intelligence and cybersecurity meet. It covers the techniques, systems,
  frameworks, rules and incidents on four sides of that meeting, and the links between them:
  - Attacks on machine learning: adversarial examples, data poisoning and backdoors, model
    extraction, membership inference and training-data extraction, and the defences against them
  - Attacks on language models and agents: prompt injection (direct and indirect), jailbreaks,
    tool and protocol misuse (such as the Model Context Protocol), AI worms, deceptive models
  - AI used for defence: intrusion and anomaly detection, security operations, malware
    analysis, fuzzing and automated vulnerability discovery, AI-assisted penetration testing
  - AI used for attack: AI-assisted phishing and social engineering, deepfakes and voice
    cloning, misuse of AI models by threat actors, evaluations of AI cyber-offence capability
  - Frameworks and taxonomies: OWASP Top 10 for LLM applications, MITRE ATT&CK and ATLAS,
    NIST AI 100-2 and the AI Risk Management Framework, red teaming, threat modelling, CVE
  - Regulation and governance: the EU AI Act, United States executive orders on AI, AI safety
    institutes and summits, secure AI development guidelines from security agencies
  - Incidents: occurrences in which an AI system was attacked, misused, or itself caused a
    security or safety failure, including incidents still under investigation
  - The ground beneath: software supply chain attacks, vulnerabilities and zero-days
  Not covered: working exploit code, payloads or jailbreak prompts reproduced verbatim,
  product comparisons, or step-by-step instructions for carrying out an attack.


# How this wiki introduces itself to its readers, one entry per language (1-3
# sentences each). Written by hand — nothing generates or translates it.
#
# This is NOT `theme` above. `theme` is addressed to the LLM and is read only by
# wikicommit-generate and wikicommit-collect; it is a single string, so on a
# multilingual wiki it reaches most readers in a language they cannot read
# (Issue #670). Different audience, different requirement: no rule keeps the two
# in sync, and either may be left unset.
#
# Shown on the published site's top page, under the link for that language. A
# language with no entry simply gets no description.
#
# site_description:
#   it: "Una base di conoscenza dedicata al Decameron di Giovanni Boccaccio."
#   en: "A knowledge base on Giovanni Boccaccio's Decameron."
#   ja: "ジョヴァンニ・ボッカッチョ『デカメロン』の知識ベース。"

site_description:
  en: "A map of where AI and cybersecurity meet — attacks on AI, AI for defence and attack, the frameworks and rules around them, and the incidents where they happened — built from openly licensed sources."
  ja: "AI とサイバーセキュリティが交わる領域の地図。AI への攻撃、AI による防御と攻撃、それらを取り巻く枠組みと規則、そして実際に起きた事案を、開いたライセンスのソースから作っています。"


generate:
  max_retries: 2

schema:
  base_types: [Person, Place, Organization, Event, HowTo, DefinedTerm, SoftwareApplication, Dataset, ScholarlyArticle, NewsArticle, BlogPosting, ShortStory, Book]
